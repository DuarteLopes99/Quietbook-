name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"   # the oldest Python the README promises
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on Windows, the same shell git hooks run in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: No personal data in the repository
        run: python scripts/check_privacy.py

      - name: Engine, rules and classifier tests (Node)
        run: node --test

      - name: Local server tests (Python)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Pre-commit hook blocks personal data
        run: |
          git config user.email ci@example.com
          git config user.name ci
          python scripts/install_git_hooks.py
          echo "Date,Description,Amount" > data/leak.csv
          git add -f data/leak.csv
          if git commit -m "should be refused"; then
            echo "The hook let a data file through"; exit 1
          fi
          git reset -q

      - name: Launchers parse
        if: runner.os != 'Windows'
        run: bash -n scripts/quietbook.sh && bash -n scripts/Quietbook.command

      - name: Pipeline walkthrough notebook runs
        if: matrix.python == '3.12'
        run: |
          python -m pip install --quiet pandas nbconvert ipykernel
          jupyter nbconvert --to notebook --execute notebook/pipeline_walkthrough.ipynb --output-dir "$RUNNER_TEMP"
