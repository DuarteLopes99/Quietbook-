<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">From a bank export to the dashboard</title>
  <desc id="d">Bank export with balance, read in the browser, internal transfers set aside, categorized by your rules and the built-in rules, given a hash id with an occurrence number, merged append-only into transactions.csv, shown in the dashboard and checked against the bank balance. Your manual review saves rules and decisions that feed the next import.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box { stroke-width: 0.8; }
      .ok { fill: #E1F5EE; stroke: #0F6E56; }
      .next { fill: #FAEEDA; stroke: #854F0B; }
      .src { fill: #F1EFE8; stroke: #5F5E5A; }
      .th { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .ts { font-size: 12px; text-anchor: middle; dominant-baseline: central; }
      .ok-t { fill: #085041; } .ok-s { fill: #0F6E56; }
      .nx-t { fill: #633806; } .nx-s { fill: #854F0B; }
      .sr-t { fill: #444441; } .sr-s { fill: #5F5E5A; }
      .line { stroke: #5F5E5A; stroke-width: 1.2; fill: none; }
      .dash { stroke: #888780; stroke-width: 1; fill: none; stroke-dasharray: 4 4; }
      .lbl { font-size: 12px; fill: #5F5E5A; }
    </style>
  </defs>
  <rect width="680" height="380" fill="#FFFFFF"/>

  <rect class="box src" x="40" y="40" width="136" height="56" rx="8"/>
  <text class="th sr-t" x="108" y="59">Bank export</text><text class="ts sr-s" x="108" y="78">xls with Saldo</text>
  <rect class="box ok" x="196" y="40" width="136" height="56" rx="8"/>
  <text class="th ok-t" x="264" y="59">Read in browser</text><text class="ts ok-s" x="264" y="78">keeps balance</text>
  <rect class="box ok" x="352" y="40" width="136" height="56" rx="8"/>
  <text class="th ok-t" x="420" y="59">Internal transfer</text><text class="ts ok-s" x="420" y="78">Type Transfer</text>
  <rect class="box ok" x="508" y="40" width="136" height="56" rx="8"/>
  <text class="th ok-t" x="576" y="59">Categorize</text><text class="ts ok-s" x="576" y="78">your rules, built-in</text>
  <line class="line" x1="176" y1="68" x2="194" y2="68" marker-end="url(#a)"/>
  <line class="line" x1="332" y1="68" x2="350" y2="68" marker-end="url(#a)"/>
  <line class="line" x1="488" y1="68" x2="506" y2="68" marker-end="url(#a)"/>
  <path class="line" d="M576 96 L576 123 L108 123 L108 148" marker-end="url(#a)"/>

  <rect class="box ok" x="40" y="150" width="136" height="56" rx="8"/>
  <text class="th ok-t" x="108" y="169">Hash id</text><text class="ts ok-s" x="108" y="188">+ occurrence</text>
  <rect class="box ok" x="196" y="150" width="136" height="56" rx="8"/>
  <text class="th ok-t" x="264" y="169">Dedup + merge</text><text class="ts ok-s" x="264" y="188">full import report</text>
  <rect class="box ok" x="352" y="150" width="136" height="56" rx="8"/>
  <text class="th ok-t" x="420" y="169">transactions.csv</text><text class="ts ok-s" x="420" y="188">append-only</text>
  <rect class="box ok" x="508" y="150" width="136" height="56" rx="8"/>
  <text class="th ok-t" x="576" y="169">Dashboard</text><text class="ts ok-s" x="576" y="188">checked vs bank</text>
  <line class="line" x1="176" y1="178" x2="194" y2="178" marker-end="url(#a)"/>
  <line class="line" x1="332" y1="178" x2="350" y2="178" marker-end="url(#a)"/>
  <line class="line" x1="488" y1="178" x2="506" y2="178" marker-end="url(#a)"/>
  <line class="line" x1="576" y1="206" x2="576" y2="244" marker-end="url(#a)"/>

  <rect class="box next" x="440" y="246" width="204" height="56" rx="8"/>
  <text class="th nx-t" x="542" y="265">Manual review</text><text class="ts nx-s" x="542" y="284">rules you tick, decisions</text>
  <path class="dash" d="M440 274 L22 274 L22 20 L576 20 L576 36" marker-end="url(#a)"/>
  <text class="lbl" x="230" y="264" text-anchor="middle">rules feed the next import</text>

  <rect class="box ok" x="40" y="336" width="14" height="14" rx="3"/><text class="lbl" x="62" y="343" dominant-baseline="central">automatic</text>
  <rect class="box next" x="160" y="336" width="14" height="14" rx="3"/><text class="lbl" x="182" y="343" dominant-baseline="central">your decision</text>
</svg>
